<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ed">
<title>Kindergarten Flash Cards</title>
<style>
  :root{
    --bg:#fff8ed; --panel:#ffffff; --ink:#263238; --muted:#65727a;
    --brand:#6b5cff; --brand2:#ffbf47; --good:#1b8a5a; --soft:#f0edff;
    --shadow:0 10px 28px rgba(40,38,70,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#fff8ed,#f8fbff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
  button,input,select{font:inherit}
  .wrap{max-width:860px;margin:auto;padding:18px 16px 110px}
  header{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
  .logo{width:54px;height:54px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}
  h1{font-size:clamp(24px,7vw,36px);margin:0;line-height:1.05}
  .sub{margin:3px 0 0;color:var(--muted);font-size:14px}
  .toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}
  .search{width:100%;padding:14px 16px;border:2px solid #e7e3d9;border-radius:16px;background:#fff;outline:none}
  .search:focus{border-color:var(--brand)}
  .smallbtn,.pill,.action{border:0;border-radius:14px;padding:12px 14px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.06);font-weight:800;color:var(--ink)}
  .smallbtn:active,.pill:active,.action:active{transform:scale(.98)}
  .subjects{display:flex;gap:8px;overflow:auto;padding:3px 1px 10px;scrollbar-width:none}
  .subjects::-webkit-scrollbar{display:none}
  .pill{white-space:nowrap;border:2px solid transparent}
  .pill.active{background:var(--brand);color:#fff}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
  .stat{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
  .section-title{font-size:21px;margin:22px 2px 10px}
  .lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .lesson{background:#fff;border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
  .lesson:active{transform:scale(.99)}
  .lesson .top{display:flex;gap:10px;align-items:flex-start}
  .icon{font-size:27px}.lesson h3{font-size:16px;margin:1px 0 4px}.meta{font-size:12px;color:var(--muted)}
  .bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
  .empty{background:#fff;padding:24px;border-radius:20px;text-align:center;color:var(--muted)}
  #study{display:none}
  .study-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
  .back{border:0;background:#fff;border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);font-weight:800}
  .study-title{font-weight:900;text-align:center;flex:1}
  .counter{font-size:13px;color:var(--muted);text-align:right}
  .cardwrap{perspective:1000px}
  .flashcard{height:min(58vh,430px);min-height:310px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer}
  .flashcard.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border-radius:28px;box-shadow:0 18px 46px rgba(51,44,84,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:3px solid rgba(107,92,255,.09)}
  .backface{transform:rotateY(180deg);background:#fffdf7}
  .hint{position:absolute;bottom:18px;font-size:12px;color:var(--muted)}
  .fronttext{font-weight:900;font-size:clamp(40px,12vw,82px);line-height:1.05}
  .backtext{font-weight:850;font-size:clamp(28px,8vw,52px);line-height:1.15}
  .micbox{margin:14px 0 10px;text-align:center}
  .micbtn{width:100%;border:0;border-radius:20px;padding:17px 14px;background:#6b5cff;color:#fff;font-weight:950;font-size:20px;box-shadow:var(--shadow)}
  .micbtn.listening{background:#e34e62;animation:pulse 1s infinite}
  .micbtn:disabled{opacity:.5}
  @keyframes pulse{50%{transform:scale(.985)}}
  .micstatus{min-height:48px;margin-top:9px;padding:9px 12px;border-radius:14px;font-size:14px;font-weight:750;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center}
  .micstatus.good{background:#e7f8ef;color:#126c46}
  .micstatus.try{background:#fff0e7;color:#9b4b1d}
  .study-actions{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
  .again{background:#fff0e7;color:#9b4b1d}.got{background:#e7f8ef;color:#126c46}
  .nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .nav button{border:0;background:#fff;border-radius:15px;padding:13px;font-weight:850;box-shadow:var(--shadow)}
  .speak{background:var(--soft)!important;color:#493bc7!important}
  .footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.4}
  .allstudy{width:100%;margin:4px 0 8px;background:var(--brand);color:white;border:0;border-radius:16px;padding:14px;font-weight:900}
  @media(max-width:560px){.lesson-grid{grid-template-columns:1fr 1fr}.lesson{padding:14px;min-height:124px}.summary{gap:7px}.wrap{padding-left:12px;padding-right:12px}}
  @media(max-width:390px){.lesson-grid{grid-template-columns:1fr}.lesson{min-height:108px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <header>
      <div class="logo">🎒</div>
      <div><h1>Kindergarten Cards</h1><div class="sub">Small lessons • Big cards • Learn all year</div></div>
    </header>

    <div class="summary">
      <div class="stat"><b id="lessonCount">0</b><span>lessons</span></div>
      <div class="stat"><b id="cardCount">0</b><span>cards</span></div>
      <div class="stat"><b id="masteredCount">0</b><span>got it</span></div>
    </div>

    <button class="allstudy" id="practiceBtn">⭐ Practice 10 Mixed Cards</button>

    <div class="toolbar">
      <input id="search" class="search" placeholder="Search lessons…">
      <button class="smallbtn" id="resetBtn" title="Reset progress">↻</button>
    </div>
    <div class="subjects" id="subjectTabs"></div>
    <div id="lessonList"></div>
  </section>

  <section id="study">
    <div class="study-head">
      <button class="back" id="backBtn">← Lessons</button>
      <div class="study-title" id="studyTitle"></div>
      <div class="counter" id="counter"></div>
    </div>

    <div class="cardwrap">
      <div class="flashcard" id="flashcard" role="button" tabindex="0" aria-label="Flash card. Tap to flip.">
        <div class="face frontface">
          <div class="fronttext" id="frontText"></div>
          <div class="hint">Tap the card to flip</div>
        </div>
        <div class="face backface">
          <div class="backtext" id="backText"></div>
          <div class="hint">Tap again to see the front</div>
        </div>
      </div>
    </div>

    <div class="micbox">
      <button class="micbtn" id="micBtn">🎤 Say the Answer</button>
      <div class="micstatus" id="micStatus">Tap the microphone, then say your answer.</div>
    </div>

    <div class="study-actions">
      <button class="action again" id="againBtn">↻ Practice again</button>
    </div>

    <div class="nav">
      <button id="prevBtn">← Back</button>
      <button class="speak" id="speakBtn">🔊 Hear</button>
      <button id="nextBtn">Next →</button>
    </div>
    <div class="footer-note">A card is marked learned only after the microphone hears a correct answer. Progress is saved on this device.</div>
  </section>
</div>

ront": "Want", "back": "something nice to have but not necessary"}, {"front": "Water", "back": "need"}, {"front": "Food", "back": "need"}, {"front": "Safe shelter", "back": "need"}, {"front": "Toy", "back": "want"}, {"front": "Candy", "back": "want"}, {"front": "Warm clothing in cold weather", "back": "need"}]}, {"title": "Past, Present & Future", "icon": "⌛", "note": "", "cards": [{"front": "Past", "back": "already happened"}, {"front": "Present", "back": "happening now"}, {"front": "Future", "back": "has not happened yet"}, {"front": "Yesterday", "back": "past"}, {"front": "Today", "back": "present"}, {"front": "Tomorrow", "back": "future"}, {"front": "History", "back": "learning about the past"}]}, {"title": "Places & Landmarks", "icon": "📍", "note": "", "cards": [{"front": "City", "back": "a large community"}, {"front": "Town", "back": "a community smaller than many cities"}, {"front": "Country", "back": "a nation with its own government"}, {"front": "State", "back": "a large region that is part of the United States"}, {"front": "Landmark", "back": "a place or object that helps identify an area"}]}, {"title": "U.S. Symbols", "icon": "🇺🇸", "note": "", "cards": [{"front": "United States flag", "back": "a national symbol"}, {"front": "Bald eagle", "back": "a national symbol"}, {"front": "White House", "back": "home and workplace of the U.S. president"}, {"front": "Statue of Liberty", "back": "a famous U.S. landmark"}, {"front": "National anthem", "back": "a country's official song"}]}], "Life Skills": [{"title": "Colors", "icon": "🎨", "note": "", "cards": [{"front": "🔴 red", "back": "red"}, {"front": "🟠 orange", "back": "orange"}, {"front": "🟡 yellow", "back": "yellow"}, {"front": "🟢 green", "back": "green"}, {"front": "🔵 blue", "back": "blue"}, {"front": "🟣 purple", "back": "purple"}, {"front": "🟤 brown", "back": "brown"}, {"front": "⚫ black", "back": "black"}, {"front": "⚪ white", "back": "white"}, {"front": "🩷 pink", "back": "pink"}]}, {"title": "Emotions", "icon": "🙂", "note": "", "cards": [{"front": "😊", "back": "happy"}, {"front": "😢", "back": "sad"}, {"front": "😡", "back": "angry"}, {"front": "😨", "back": "scared"}, {"front": "😴", "back": "tired"}, {"front": "😮", "back": "surprised"}, {"front": "When I am upset…", "back": "I can pause, breathe, and ask for help"}]}, {"title": "Safety Basics", "icon": "🦺", "note": "", "cards": [{"front": "Seat belt", "back": "wear it in the car"}, {"front": "Helmet", "back": "wear it for biking/scooters"}, {"front": "Hot stove", "back": "do not touch"}, {"front": "Unknown medicine", "back": "do not take it"}, {"front": "Emergency", "back": "get a trusted adult or call for emergency help with an adult"}, {"front": "Street", "back": "stop and look with a grown-up before crossing"}]}, {"title": "Healthy Habits", "icon": "🧼", "note": "", "cards": [{"front": "Wash hands", "back": "helps remove germs"}, {"front": "Brush teeth", "back": "morning and night"}, {"front": "Sleep", "back": "helps your body and brain rest"}, {"front": "Water", "back": "helps keep your body hydrated"}, {"front": "Movement", "back": "helps keep your body strong"}, {"front": "Fruits and vegetables", "back": "foods that provide important nutrients"}]}]};
const STORAGE_KEY = "kindergarten-card-progress-v1";
let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let activeSubject = "All";
let currentCards = [];
let currentIndex = 0;
let currentLessonKey = "";
let currentLessonTitle = "";
let mixedMode = false;
let recognition = null;
let listening = false;

const $ = s => document.querySelector(s);
const home = $("#home"), study = $("#study");

function allLessons(){
  const rows=[];
  Object.entries(DATA).forEach(([subject, lessons])=>{
    lessons.forEach((lesson,idx)=>rows.push({...lesson, subject, key: subject+"::"+idx}));
  });
  return rows;
}
function totalCards(){return allLessons().reduce((a,l)=>a+l.cards.length,0)}
function cardId(key,i){return key+"::"+i}
function masteredForLesson(lesson){
  return lesson.cards.filter((_,i)=>progress[cardId(lesson.key,i)]==="got").length;
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(progress)); updateStats()}
function updateStats(){
  $("#lessonCount").textContent=allLessons().length;
  $("#cardCount").textContent=totalCards();
  $("#masteredCount").textContent=Object.values(progress).filter(v=>v==="got").length;
}
function renderTabs(){
  const names=["All",...Object.keys(DATA)];
  $("#subjectTabs").innerHTML=names.map(n=>`<button class="pill ${n===activeSubject?'active':''}" data-sub="${n}">${n}</button>`).join("");
  document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{activeSubject=b.dataset.sub;renderTabs();renderLessons()});
}
function renderLessons(){
  const q=$("#search").value.trim().toLowerCase();
  const lessons=allLessons().filter(l=>(activeSubject==="All"||l.subject===activeSubject) && (l.title+" "+l.subject).toLowerCase().includes(q));
  if(!lessons.length){$("#lessonList").innerHTML='<div class="empty">No lessons found.</div>';return}
  const groups={};
  lessons.forEach(l=>(groups[l.subject]??=[]).push(l));
  $("#lessonList").innerHTML=Object.entries(groups).map(([subject,items])=>`
    <h2 class="section-title">${subject}</h2>
    <div class="lesson-grid">
      ${items.map(l=>{
        const m=masteredForLesson(l), pct=Math.round(m/l.cards.length*100);
        return `<button class="lesson" data-key="${l.key}">
          <div class="top"><div class="icon">${l.icon}</div><div><h3>${l.title}</h3><div class="meta">${l.cards.length} cards • ${m}/${l.cards.length} learned</div></div></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </button>`
      }).join("")}
    </div>`).join("");
  document.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>startLesson(b.dataset.key));
}
function startLesson(key){
  const lesson=allLessons().find(l=>l.key===key);
  currentLessonKey=key; currentLessonTitle=lesson.title;
  currentCards=lesson.cards.map((c,i)=>({...c, sourceKey:key, sourceIndex:i, lessonTitle:lesson.title}));
  currentIndex=0; mixedMode=false; $("#studyTitle").textContent=lesson.title; openStudy();
}
function startMixed(){
  const pool=[];
  allLessons().forEach(l=>l.cards.forEach((c,i)=>pool.push({...c, sourceKey:l.key, sourceIndex:i, lessonTitle:l.title})));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  currentCards=pool.slice(0,10); currentIndex=0; currentLessonKey=""; currentLessonTitle="Mixed Practice"; mixedMode=true; $("#studyTitle").textContent="Mixed Practice"; openStudy();
}
function openStudy(){home.style.display="none";study.style.display="block";showCard();window.scrollTo(0,0)}
function closeStudy(){study.style.display="none";home.style.display="block";renderLessons();updateStats();window.scrollTo(0,0)}
function showCard(){
  const c=currentCards[currentIndex]; if(!c)return;
  stopListening();
  $("#flashcard").classList.remove("flipped");
  $("#frontText").textContent=c.front; $("#backText").textContent=c.back;
  $("#counter").textContent=(currentIndex+1)+" / "+currentCards.length;
  const status=progress[cardId(c.sourceKey,c.sourceIndex)];
  $("#againBtn").textContent=status==="again"?"↻ Practicing":"↻ Practice again";
  setMicStatus(status==="got" ? "✓ Already learned — say it again for practice!" : "Tap the microphone, then say your answer.", status==="got" ? "good" : "");
}
function next(){currentIndex=(currentIndex+1)%currentCards.length;showCard()}
function prev(){currentIndex=(currentIndex-1+currentCards.length)%currentCards.length;showCard()}
function mark(value){
  const c=currentCards[currentIndex]; progress[cardId(c.sourceKey,c.sourceIndex)]=value;save();next();
}

const numberWords = {
  "zero":"0","one":"1","two":"2","three":"3","four":"4","five":"5","six":"6","seven":"7","eight":"8","nine":"9","ten":"10",
  "eleven":"11","twelve":"12","thirteen":"13","fourteen":"14","fifteen":"15","sixteen":"16","seventeen":"17","eighteen":"18","nineteen":"19","twenty":"20"
};

function normalizeSpeech(s){
  s = String(s || "").toLowerCase().trim()
    .replace(/&/g," and ")
    .replace(/[’']/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ").trim();
  const parts=s.split(" ").map(w=>numberWords[w] ?? w);
  return parts.join(" ");
}
function cleanFront(s){
  return String(s||"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}
function expectedAnswers(c){
  const title=(c.lessonTitle || "").toLowerCase();
  const front=cleanFront(c.front);
  const back=cleanFront(c.back);
  let answers=[];

  // Cards where the child is primarily practicing reading/recognition aloud.
  if(
    title.includes("uppercase letters") ||
    title.includes("lowercase letters") ||
    title.includes("sight words") ||
    title.includes("cvc words") ||
    title === "numbers 0–10" ||
    title === "numbers 11–20" ||
    title === "colors"
  ){
    answers=[front];
  } else {
    // For question/concept cards, the back is the answer.
    answers=[back];
  }

  // Add useful short-answer alternatives.
  if(title.includes("rhyming words")) answers.push(back.split(" ")[0]);
  if(title.includes("syllables")){
    const m=back.match(/\d+/); if(m) answers.push(m[0]);
  }
  if(title.includes("beginning sounds") || title.includes("ending sounds")){
    const letter=(back.match(/[A-Z]\b/i)||[])[0]; if(letter) answers.push(letter);
  }
  if(title.includes("letter sounds")){
    // Accept the letter name as a practical kindergarten speech check.
    const first=(front.match(/[A-Za-z]/)||[])[0]; if(first) answers.push(first);
  }
  if(title.includes("2d shapes") || title.includes("3d shapes")){
    answers.push(front);
  }
  if(title.includes("coins")){
    if(back.includes("1")) answers.push("one cent");
    if(back.includes("5")) answers.push("five cents");
    if(back.includes("10")) answers.push("ten cents");
    if(back.includes("25")) answers.push("twenty five cents");
  }

  return [...new Set(answers.map(normalizeSpeech).filter(Boolean))];
}
function answerMatches(spoken, c){
  const heard=normalizeSpeech(spoken);
  const expected=expectedAnswers(c);
  if(!heard) return false;

  return expected.some(ans=>{
    if(heard===ans) return true;
    // Let a child say a short answer inside a longer recognized phrase.
    if(ans.length>=2 && (" "+heard+" ").includes(" "+ans+" ")) return true;
    if(heard.length>=2 && (" "+ans+" ").includes(" "+heard+" ")) return true;
    return false;
  });
}
function setMicStatus(msg, cls=""){
  const el=$("#micStatus");
  el.textContent=msg;
  el.className="micstatus"+(cls ? " "+cls : "");
}
function setupRecognition(){
  const SR=window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    $("#micBtn").disabled=true;
    setMicStatus("Speech recognition is not available in this browser. Try Safari on a current iPhone/iPad, or Chrome on a supported device.","try");
    return;
  }
  recognition=new SR();
  recognition.lang="en-US";
  recognition.interimResults=false;
  recognition.continuous=false;
  recognition.maxAlternatives=5;

  recognition.onstart=()=>{
    listening=true;
    $("#micBtn").classList.add("listening");
    $("#micBtn").textContent="🎤 Listening…";
    setMicStatus("Listening… say the answer now.");
  };
  recognition.onresult=(event)=>{
    const c=currentCards[currentIndex];
    const alternatives=[];
    for(let i=0;i<event.results[0].length;i++) alternatives.push(event.results[0][i].transcript);
    const correct=alternatives.some(t=>answerMatches(t,c));
    const heard=alternatives[0] || "";

    if(correct){
      progress[cardId(c.sourceKey,c.sourceIndex)]="got";
      save();
      $("#flashcard").classList.add("flipped");
      setMicStatus(`✓ Correct! I heard “${heard}”. This card is now learned.`,"good");
      if(navigator.vibrate) navigator.vibrate(60);
      setTimeout(()=>{ if(currentCards[currentIndex]===c) next(); },1100);
    } else {
      progress[cardId(c.sourceKey,c.sourceIndex)]="again";
      save();
      setMicStatus(`Try again. I heard “${heard || "nothing"}”.`,"try");
    }
  };
  recognition.onerror=(event)=>{
    const friendly={
      "not-allowed":"Microphone permission was blocked. Allow microphone access for this website and try again.",
      "audio-capture":"I could not access the microphone.",
      "no-speech":"I didn't hear an answer. Tap the microphone and try again.",
      "network":"Speech recognition had a network problem. Try again."
    };
    setMicStatus(friendly[event.error] || "I couldn't understand that. Try again.","try");
  };
  recognition.onend=()=>{
    listening=false;
    $("#micBtn").classList.remove("listening");
    $("#micBtn").textContent="🎤 Say the Answer";
  };
}
function startListening(){
  if(!recognition){setupRecognition(); if(!recognition)return}
  if(listening){stopListening();return}
  try{ recognition.start(); }catch(e){}
}
function stopListening(){
  if(recognition && listening){
    try{recognition.stop()}catch(e){}
  }
}

function speak(){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const c=currentCards[currentIndex];
  const text=$("#flashcard").classList.contains("flipped")?c.back:c.front;
  const u=new SpeechSynthesisUtterance(text.replace(/[^\w\s.,?!+\-]/g," "));
  u.rate=.82; u.pitch=1.05; speechSynthesis.speak(u);
}

$("#search").addEventListener("input",renderLessons);
$("#practiceBtn").onclick=startMixed;
$("#resetBtn").onclick=()=>{
  if(confirm("Reset all saved flash-card progress on this device?")){
    progress={};save();renderLessons();
  }
};
$("#backBtn").onclick=closeStudy;
$("#flashcard").onclick=()=>$("#flashcard").classList.toggle("flipped");
$("#flashcard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#flashcard").click()}};
$("#nextBtn").onclick=next; $("#prevBtn").onclick=prev; $("#speakBtn").onclick=speak;
$("#againBtn").onclick=()=>mark("again");
$("#micBtn").onclick=startListening;

renderTabs();renderLessons();updateStats();setupRecognition();
</script>
